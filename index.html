      { id: 94, q: "5টি সংখ্যার গড় 42। একটি সংখ্যা বাদ দিলে অবশিষ্ট 4টি সংখ্যার গড় 38 হয়। বাদ দেওয়া সংখ্যাটি কত?", options: ["A) 52", "B) 54", "C) 58", "D) 60"], ans: "C" },
      { id: 95, q: "একটি ট্রেন 72 কিমি/ঘণ্টা বেগে চললে একটি খুঁটি অতিক্রম করতে 15 সেকেন্ড সময় নেয়। ট্রেনটির দৈর্ঘ্য কত?", options: ["A) 250 মিটার", "B) 275 মিটার", "C) 300 মিটার", "D) 325 মিটার"], ans: "C" },
      { id: 96, q: "11টি সংখ্যার গড় 36। একটি সংখ্যা 36-এর পরিবর্তে 58 লেখা হলে সঠিক গড় কত হবে?", options: ["A) 38", "B) 40", "C) 42", "D) 44"], ans: "A" },
      { id: 97, q: "A, B ও C একটি ব্যবসায় যথাক্রমে 5,000 টাকা 12 মাসের জন্য, 6,000 টাকা 10 মাসের জন্য এবং 8,000 টাকা 6 মাসের জন্য বিনিয়োগ করল। মোট লাভ 28,000 টাকা হলে C-এর লাভের অংশ কত?", options: ["A) 7,000 টাকা", "B) 8,000 টাকা", "C) 9,000 টাকা", "D) 10,000 টাকা"], ans: "B" },
      { id: 98, q: "সিমন এবং অনিক তাদের আয়ের যথাক্রমে 25% ও 40% সঞ্চয় করে। যদি তাদের খরচ সমান হয়, তবে সিমন ও অনিকের আয়ের অনুপাত কত?", options: ["A) 4 : 5", "B) 3 : 4", "C) 5 : 6", "D) 6 : 5"], ans: "A" },
      { id: 99, q: "যদি P-এর 40% = Q-এর 0.75 = R-এর ¼ হয়, তবে P : Q : R-এর মান নির্ণয় করো।", options: ["A) 15 : 7 : 25", "B) 3 : 26 : 28", "C) 16 : 8 : 5", "D) 15 : 8 : 24"], ans: "D" },
      { id: 100, q: "একটি বইয়ের তাকের বিক্রয়মূল্য 2,000 টাকা কমে যাওয়ায় 10% লাভের পরিবর্তে 10% ক্ষতি হয়। বইয়ের তাকটির আগের বিক্রয়মূল্য কত ছিল?", options: ["A) 10,000 টাকা", "B) 11,000 টাকা", "C) 12,000 টাকা", "D) 9,000 টাকা"], ans: "B" }
    ];

    let currentStudent = { name: "", phone: "" };
    let timerInterval;
    let timeRemaining = 90 * 60; // 90 mins in seconds

    async function startExam() {
      const phone = document.getElementById("student-phone").value.trim();
      const name = document.getElementById("student-name").value.trim() || "Student";
      const errorEl = document.getElementById("login-error");

      if (!phone) {
        errorEl.textContent = "Please enter your mobile number.";
        return;
      }

      errorEl.textContent = "Verifying mobile number...";

      try {
        const response = await fetch(`${APP_SCRIPT_URL}?action=verify&phone=${phone}`);
        const result = await response.json();

        if (result.success) {
          currentStudent = { name, phone };
          document.getElementById("login-section").classList.add("hidden");
          document.getElementById("test-section").classList.remove("hidden");
          document.getElementById("user-display").textContent = `Student: ${name} (${phone})`;
          document.getElementById("preview-student-name").textContent = name;
          document.getElementById("preview-student-phone").textContent = phone;
          renderQuestions();
          startTimer();
        } else {
          errorEl.textContent = result.message;
        }
      } catch (err) {
        errorEl.textContent = "Error connecting to the whitelist server. Please verify your Web App URL.";
      }
    }

    function renderQuestions() {
      const container = document.getElementById("questions-container");
      container.innerHTML = questions.map(q => `
        <div class="question-card" id="q-card-${q.id}">
          <div class="question-title">${q.id}. ${q.q}</div>
          <ul class="options-list">
            ${q.options.map((opt, idx) => {
              const optVal = String.fromCharCode(65 + idx);
              return `
                <li>
                  <label id="lbl-${q.id}-${optVal}">
                    <input type="radio" name="q_${q.id}" value="${optVal}">
                    ${opt}
                  </label>
                </li>
              `;
            }).join("")}
          </ul>
        </div>
      `).join("");
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timeRemaining--;
        const mins = Math.floor(timeRemaining / 60);
        const secs = timeRemaining % 60;
        document.getElementById("timer").textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          submitExam();
        }
      }, 1000);
    }

    function submitExam() {
      clearInterval(timerInterval);

      let correct = 0;
      let wrong = 0;
      let unattempted = 0;

      questions.forEach(q => {
        const selected = document.querySelector(`input[name="q_${q.id}"]:checked`);
        if (selected) {
          if (selected.value === q.ans) {
            correct++;
          } else {
            wrong++;
          }
        } else {
          unattempted++;
        }
      });

      const score = (correct * 1) - (wrong * 0.25);

      document.getElementById("res-name").textContent = currentStudent.name;
      document.getElementById("res-phone").textContent = currentStudent.phone;
      document.getElementById("res-correct").textContent = correct;
      document.getElementById("res-wrong").textContent = wrong;
      document.getElementById("res-unattempted").textContent = unattempted;
      document.getElementById("res-score").textContent = score.toFixed(2);

      // Save Data to Google Sheet
      fetch(APP_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: currentStudent.name,
          phone: currentStudent.phone,
          score: score,
          correct: correct,
          wrong: wrong,
          unattempted: unattempted
        })
      });

      document.getElementById("test-section").classList.add("hidden");
      document.getElementById("result-section").classList.remove("hidden");
    }

    function enablePreview() {
      document.getElementById("result-section").classList.add("hidden");
      document.getElementById("test-section").classList.remove("hidden");
      document.body.classList.add("preview-mode");

      // Hide the Submit Test button completely during preview/download
      document.getElementById("submit-btn").style.display = "none";

      questions.forEach(q => {
        const selected = document.querySelector(`input[name="q_${q.id}"]:checked`);
        const correctLabel = document.getElementById(`lbl-${q.id}-${q.ans}`);
        
        if (correctLabel) {
          correctLabel.classList.add("correct-ans");
        }

        if (selected && selected.value !== q.ans) {
          const wrongLabel = document.getElementById(`lbl-${q.id}-${selected.value}`);
          if (wrongLabel) {
            wrongLabel.classList.add("wrong-ans");
          }
        }
        
        // Disable choices in preview mode
        const inputs = document.querySelectorAll(`input[name="q_${q.id}"]`);
        inputs.forEach(i => i.disabled = true);
      });
    }
  </script>
